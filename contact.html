
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Snaider Anyango</title>

    <link rel="stylesheet" href="style.css">

    <!-- EmailJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Initialize EmailJS -->
    <script>
        emailjs.init({
            publicKey: "PI8x65Sc25H19eaIJ"
        });
    </script>
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <h2 class="logo">Snaider Anyango</h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="interests.html">Interests</a></li>
                <li><a href="goals.html">Goals</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact-section">

        <div class="contact-box">

            <h1>Get In Touch</h1>

            <p>
                Hello! Thank you for visiting my personal profile.
                Feel free to send me a message. I would love to hear from you!
            </p>

            <form id="contact-form">

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

            

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                        required></textarea>
                </div>

                <button type="submit" id="send-button">
                    Send Message
                </button>

                <p id="form-status" aria-live="polite"></p>

            </form>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; <span id="year"></span> Snaider Anyango. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
